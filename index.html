<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#08110d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Люмен</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2308110d' width='32' height='32' rx='8'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e7b15a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261122c" />
</head>
<body>
  <svg class="vista" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#07110e" />
        <stop offset="48%" stop-color="#143024" />
        <stop offset="100%" stop-color="#0c1411" />
      </linearGradient>
      <radialGradient id="moon" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f4ecd4" stop-opacity="0.9" />
        <stop offset="70%" stop-color="#f4ecd4" stop-opacity="0.15" />
        <stop offset="100%" stop-color="#f4ecd4" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="lampGlow" cx="50%" cy="42%" r="48%">
        <stop offset="0%" stop-color="#ffc27a" stop-opacity="0.72" />
        <stop offset="38%" stop-color="#ff9a4a" stop-opacity="0.16" />
        <stop offset="100%" stop-color="#ff9a4a" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e4a34" />
        <stop offset="100%" stop-color="#0c1c14" />
      </linearGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#sky)" />
    <circle cx="1080" cy="150" r="90" fill="url(#moon)" />
    <g fill="none" stroke="rgba(214,232,214,0.2)" stroke-width="2">
      <path d="M90 900 V430 C90 160 390 70 720 70 C1050 70 1350 160 1350 430 V900" />
      <path d="M230 900 V470 C230 240 430 160 720 160 C1010 160 1210 240 1210 470 V900" />
      <path d="M390 900 V520 C390 330 510 270 720 270 C930 270 1050 330 1050 520 V900" />
    </g>
    <g stroke="rgba(214,232,214,0.09)" stroke-width="1">
      <path d="M720 70 V900" />
      <path d="M250 390 H1190" />
      <path d="M400 250 H1040" />
    </g>
    <ellipse class="glow" cx="720" cy="150" rx="460" ry="280" fill="url(#lampGlow)" />
    <g class="lamp-swing">
      <line x1="720" y1="0" x2="720" y2="86" stroke="#e0c17a" stroke-width="2" />
      <path d="M676 86 h88 l-16 34 h-56 z" fill="#e7c98a" />
      <path d="M692 120 q28 78 28 78 q0 0 -28 -78 z" fill="#ffbf70" />
      <ellipse cx="720" cy="124" rx="22" ry="8" fill="#ffe1b5" />
    </g>
    <g fill="url(#leaf)">
      <path d="M70 900 C80 760 40 700 110 640 C150 700 130 790 150 900 Z" />
      <path d="M120 900 C150 730 90 640 180 560 C230 660 190 800 210 900 Z" />
      <path d="M190 900 C210 760 250 700 300 760 C270 820 250 860 250 900 Z" />
      <path d="M1240 900 C1220 740 1300 650 1210 560 C1160 680 1200 800 1170 900 Z" />
      <path d="M1310 900 C1340 780 1280 690 1360 620 C1390 730 1360 830 1360 900 Z" />
    </g>
    <ellipse cx="720" cy="860" rx="520" ry="46" fill="rgba(0,0,0,0.35)" />
  </svg>
  <div class="flies" aria-hidden="true">
    <i style="left: 18%; top: 32%; animation-delay: -1s"></i>
    <i style="left: 72%; top: 22%; animation-delay: -4s"></i>
    <i style="left: 84%; top: 48%; animation-delay: -7s"></i>
    <i style="left: 30%; top: 18%; animation-delay: -2.5s"></i>
    <i style="left: 58%; top: 40%; animation-delay: -6s"></i>
    <i style="left: 12%; top: 58%; animation-delay: -3s"></i>
  </div>

  <header class="topbar">
    <button class="ghost lang-btn" id="lang" type="button">RU</button>
    <div class="topbar-right">
      <div class="wallet"><span class="coin" aria-hidden="true"></span><strong id="coins">0</strong></div>
      <button class="ghost" id="open-shop" type="button"></button>
    </div>
  </header>

  <main>
    <section id="start" class="start">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      <ul class="rules">
        <li id="rule1"></li>
        <li id="rule2"></li>
        <li id="rule3"></li>
      </ul>
      <div class="start-actions">
        <button class="btn" id="enter" type="button"></button>
        <button class="ghost" id="free" type="button"></button>
      </div>
      <div class="nights" id="nights"></div>
    </section>

    <section id="play" class="play" hidden>
      <div class="layout">
        <aside class="plate" id="plate"></aside>
        <div class="tray">
          <div id="board">
            <div id="cells"></div>
            <div id="fx"></div>
          </div>
          <p id="toast" class="toast" hidden></p>
        </div>
      </div>
    </section>
  </main>

  <div id="end" class="end" hidden></div>
  <div id="shop" class="end" hidden></div>
  <!-- VK Play / GitHub Pages: без рекламы, оплата через iframeApi. -->
  <script src="src/engine.js?v=20261122c"></script>
  <script type="module" src="src/game.js?v=20261122c"></script>
</body>
</html>
